name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descargar modelo de IA (Depth Anything V2 Small, int8)
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 -o app/src/main/assets/depth_model.onnx \
            https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_quantized.onnx
          ls -l app/src/main/assets
          test "$(stat -c%s app/src/main/assets/depth_model.onnx)" -gt 20000000

      - name: Pruebas unitarias
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Comprobar alineación de 16 kB de las librerías nativas
        run: |
          rm -rf /tmp/apkcheck && mkdir /tmp/apkcheck
          unzip -q app/build/outputs/apk/debug/app-debug.apk 'lib/*' -d /tmp/apkcheck
          fail=0
          for f in $(find /tmp/apkcheck -name '*.so'); do
            al=$(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
            echo "$(basename $f): LOAD align = $al"
            for a in $al; do
              if [ $((a)) -lt 16384 ]; then fail=1; fi
            done
          done
          if [ $fail -eq 1 ]; then echo "AVISO: hay librerías sin alineación de 16 kB"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: VR3D-Player-apk
          path: app/build/outputs/apk/debug/app-debug.apk
