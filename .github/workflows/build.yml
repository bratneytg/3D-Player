name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descargar modelo de IA (Depth Anything V2 Small, int8)
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 -o app/src/main/assets/depth_model.onnx \
            https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_quantized.onnx
          ls -l app/src/main/assets
          test "$(stat -c%s app/src/main/assets/depth_model.onnx)" -gt 20000000

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VR3D-Player-apk
          path: app/build/outputs/apk/debug/app-debug.apk
